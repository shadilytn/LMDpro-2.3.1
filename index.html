    <!-- Instant Theme & Language Hydration (Zero Flicker) -->
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem("app-theme") || localStorage.getItem("theme");
          var prefersLight = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
          var theme = savedTheme ? savedTheme : (prefersLight ? "light" : "dark");
          if (theme === "light") {
            document.documentElement.classList.add("light-mode");
            document.documentElement.setAttribute("data-theme", "light");
            var metaTheme = document.querySelector('meta[name="theme-color"]');
            if (metaTheme) metaTheme.setAttribute("content", "#f8fafc");
          } else {
            document.documentElement.classList.remove("light-mode");
            document.documentElement.setAttribute("data-theme", "dark");
            var metaTheme = document.querySelector('meta[name="theme-color"]');
            if (metaTheme) metaTheme.setAttribute("content", "#071319");
          }
          var savedLang = localStorage.getItem("app-language");
          if (savedLang === "ar") {
            document.documentElement.setAttribute("dir", "rtl");
            document.documentElement.setAttribute("lang", "ar");
          } else {
            document.documentElement.setAttribute("dir", "ltr");
            document.documentElement.setAttribute("lang", "en");
          }
        } catch (e) {
          console.warn("Theme hydration pre-check skipped:", e);
        }
      })();
    </script>
